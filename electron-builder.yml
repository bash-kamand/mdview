appId: com.kamand.claudeview
productName: ClaudeView
copyright: Copyright © 2026 Bashir Bandi
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/demo
    to: demo
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.developer-tools
dmg:
  artifactName: 'ClaudeView-${version}.dmg'
  title: 'ClaudeView ${version}'
publish:
  provider: github
  owner: bash-kamand
  repo: claudeview
  releaseType: release
