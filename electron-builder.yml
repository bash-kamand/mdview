appId: com.kamand.mdview
productName: MDView
copyright: Copyright © 2026 Bashir Bandi
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/demo
    to: demo
  - from: resources/skills
    to: skills
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.developer-tools
dmg:
  artifactName: 'MDView-${version}.dmg'
  title: 'MDView ${version}'
publish:
  provider: github
  owner: bash-kamand
  repo: mdview
  releaseType: release
