appId: com.kamand.mdview
productName: MDView
copyright: Copyright © 2026 Bashir Bandi
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/demo
    to: demo
  - from: resources/skills
    to: skills
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization is done as a separate step after the signed DMG is built,
  # using the 'MDView' keychain profile (xcrun notarytool), so no secrets
  # live in this repo or the build env.
  notarize: false
dmg:
  artifactName: 'MDView-${version}.dmg'
  title: 'MDView ${version}'
publish:
  provider: github
  owner: bash-kamand
  repo: mdview
  releaseType: release
